[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ear-rea-chachacha"
version = "0.1.0"
description = "A local, consent-driven, bounded capability assembly workflow"
requires-python = ">=3.11"

[project.scripts]
ear = "ear.__main__:main"

[tool.setuptools.packages.find]
include = ["ear*"]
